name: checker

# asylum.pyz (the checker plus headers, libraries and data) as the release `checker`. Its version is
# a hash of its content, so it is only uploaded when something in it changed; the checker updates
# itself from here before each claim.

on:
  push:
    branches: [main]
    paths: ["tools/asylum/**", "tools/build.py", "include/**", "third_party/**", "data/*.json.gz"]
  schedule:
    - cron: "40 5 * * *"   # CI's own commits (new symbols) don't trigger workflows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release download checker -p VERSION -O - 2>/dev/null || true)
          if [ "$have" = "$(cat dist/VERSION)" ]; then echo "unchanged"; exit 0; fi
          gh release view checker >/dev/null 2>&1 || gh release create checker --title "asylum.pyz" --notes "The checker: download asylum.pyz and run python asylum.pyz setup (see AGENTS.md)."
          v=$(cat dist/VERSION)
          # the versioned copy first: updates download the exact version VERSION names (caches can't
          # serve a stale one), then the plain name for first downloads, then VERSION
          cp dist/asylum.pyz "dist/asylum-$v.pyz"
          gh release upload checker "dist/asylum-$v.pyz" --clobber
          gh release upload checker dist/asylum.pyz --clobber
          gh release upload checker dist/VERSION --clobber
          # versioned copies beyond the newest five
          gh release view checker --json assets -q '.assets[] | select(.name | test("^asylum-[0-9a-f]+[.]pyz$")) | "\(.createdAt) \(.name)"' \
            | sort -r | tail -n +6 | cut -d' ' -f2 | xargs -r -n1 gh release delete-asset checker -y
